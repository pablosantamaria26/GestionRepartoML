<script>

  var GEN = null;

  var COMPARTIDAS = /^(qr_rend_ml_v1|qr_despacho_v1|qr_empresa_v1|qr_logo_v1|qr_papelera_v1|qr_pin_ajustes_v1|qr_precio_config_v1|qr_margen_rubros_v1|qr_historial_precios_v1|qr_compras_cfg_v1|qr_demanda_v1|qr_demanda_rubros_v1|qr_demanda_crit_v1|qr_etq_impresas_v1|etiquetas_total_impresa_v1|etiquetas_habituales_v1|etiquetas_cabos_v1)$/;

        var cp = null; try { cp = JSON.parse((opts && opts.body) || "null"); } catch (e) {}
        if (esPedido(cp) && /—\s*QUERUCLOR/iu.test(String(cp.productos))) return enviarPedido(opts);

    if (m) return _fetch(ORIGEN + m[1], conGen(opts)).then(function (r) { marcar(false); vigilar(r); return r; }, function (e) { marcar(true); throw e; });

    if (/workers\.dev/.test(url) && metodo === "POST") {
      var cuerpo = null; try { cuerpo = JSON.parse((opts && opts.body) || "null"); } catch (e) {}

    }
    if (/docs\.google\.com\/forms/.test(url)) return _fetch(ORIGEN + "/local/forms", conGen({ method: "POST", body: "{}" })).catch(function (e) { marcar(true); throw e; });

    /* Nada más sale hacia afuera escribiendo: ni Apps Script, ni otros Workers. */

    }

  };
  function enviarPedido(opts) {
    return _fetch(ORIGEN + "/local/pedido", conGen({ method: "POST", headers: { "Content-Type": "application/json" }, body: opts.body }))
      .then(function (r) {
        marcar(false);
        return r.clone().json().then(function (j) {

          if (j && j.reserva && j.reserva.faltantes && j.reserva.faltantes.length && window.qrAvisarFaltantes) {

  var GEN_KEY = "qr_entorno_gen_v1";

      try { s0.call(ls, GEN_KEY, gen); } catch (e) {}

        if (avisoApartadas || !document.body) return;

        avisoApartadas.id = "qrAvisoApartadas"; avisoApartadas.setAttribute("role", "status");

  /* ── Sin service workers en el sistema de prueba ──────────────────

<script>
/* ═══════════════════════════════════════════════════════════════════
   DEVOLUCIÓN POR ESCANEO — la parte que decide

   Circuito:
     CELULAR  escanea la etiqueta de la caja («ML-<pedido>») → ve qué
              salió en ese remito → dice cuántas cajas volvieron y cómo →
              queda una devolución PENDIENTE.
     PC       (facturación) la ve en «↩️ Devoluciones por acreditar» y con
              un toque abre la nota de crédito ya cargada. Recién ahí se
              mueve stock y cuenta corriente, en un solo paso.

   El celular NO toca stock ni plata. Una caja devuelta que se cuenta como
   stock antes de tener su nota de crédito es un agujero entre el depósito
   y la cuenta del cliente; por eso las dos cosas se mueven juntas y con
   la firma de Laura.

   Este archivo no toca pantalla ni almacenamiento: son funciones puras,
   así el celular, la PC y las pruebas usan exactamente la misma regla.
   ═══════════════════════════════════════════════════════════════════ */
(function (global) {

  /* El código de barras de la etiqueta es «ML-» + id del pedido. Un lector
     USB en teclado español a veces cambia el guion por otro símbolo, o
     agrega espacios: se tolera todo lo que no sea letra o número entre el
     «ML» y el id. */
  function pedidoIdDe(crudo) {
    const s = String(crudo == null ? "" : crudo).trim();
    /* Etiqueta con número de caja (ML-<pedido>-<nnn>). La de TOTAL (ML|…) no
       se acepta a propósito: es la de la carga de reparto (acuerdo anterior). */
    const b = s.match(/^ML[^A-Za-z0-9|]*([0-9]+)[^A-Za-z0-9|]+[0-9]{3,}\s*$/i);
    if (b) return b[1];
    const m = s.match(/^ML[^A-Za-z0-9]*([A-Za-z0-9][A-Za-z0-9_-]*)\s*$/i);
    return m ? m[1] : null;
  }

  const unidadDe = r => (r.cajas != null ? "cajas" : "un");
  const enviadoDe = r => (r.cajas != null ? Number(r.cajas) : Number(r.unidades)) || 0;

  /* Lo que ya se devolvió (notas de crédito emitidas, viene en el
     snapshot) y lo que ya está pendiente (otras devoluciones del mismo
     pedido que Laura todavía no acreditó): no se puede devolver dos veces
     la misma caja. */
  function pendienteDe(devoluciones, pedidoId) {
    const suma = {};
    (devoluciones || []).forEach(d => {
      if (d.estado !== "pendiente" || String(d.pedido_id) !== String(pedidoId)) return;
      (d.items || []).forEach(it => {
        const s = suma[it.ean] || (suma[it.ean] = { cajas: 0, sueltas: 0 });
        s.cajas += Number(it.cajas) || 0;
        s.sueltas += Number(it.sueltas) || 0;
      });
    });
    return suma;
  }

  function renglonesDevolvibles(comp, devoluciones) {
    if (!comp) return [];
    const ya = comp.devuelto || {};
    const pend = pendienteDe(devoluciones, comp.pedido_id);
    return (comp.renglones || []).map((r, i) => {
      const unidad = unidadDe(r);
      const clave = unidad === "cajas" ? "cajas" : "sueltas";
      const enviado = enviadoDe(r);
      const restado = ((ya[r.ean] || {})[clave] || 0) + ((pend[r.ean] || {})[clave] || 0);
      return {
        i, ean: r.ean, nombre: r.nombre, variante: r.variante || null,
        unidad, enviado, disponible: Math.max(0, enviado - restado),
      };
    });
  }

  /* Arma el registro que viaja a la PC. `cantidades` = { indiceDeRenglón:
     { n, sana } }. Devuelve { error } si algo no cierra, para que la
     pantalla lo diga en vez de mandar una devolución imposible. */
  function armar(o) {
    const filas = renglonesDevolvibles(o.comp, o.devoluciones);
    const items = [];
    for (const f of filas) {
      const c = (o.cantidades || {})[f.i];
      const n = c ? Math.floor(Number(c.n) || 0) : 0;
      if (n <= 0) continue;
      if (n > f.disponible) {
        return { error: "De «" + f.nombre + "» solo se pueden devolver " + f.disponible + " " +
          (f.unidad === "cajas" ? "caja(s)" : "unidad(es)") + "." };
      }
      items.push({
        ean: f.ean, nombre: f.nombre,
        cajas: f.unidad === "cajas" ? n : 0, sueltas: f.unidad === "cajas" ? 0 : n,
        sana: !(c && c.sana === false),
      });
    }
    if (!items.length) return { error: "Poné cuántas cajas volvieron." };
    if (!o.quien) return { error: "Elegí quién está haciendo la devolución." };

    return {
      registro: {
        id: o.id, pedido_id: o.comp.pedido_id, remito: o.comp.numero,
        cliente_nombre: o.comp.cliente_nombre || "", quien: o.quien,
        fecha: o.fecha || new Date().toISOString(),
        estado: "pendiente", nc: null, items,
      },
    };
  }

  function resumen(d) {
    const cajas = (d.items || []).reduce((a, i) => a + (Number(i.cajas) || 0), 0);
    const sueltas = (d.items || []).reduce((a, i) => a + (Number(i.sueltas) || 0), 0);
    const rotas = (d.items || []).filter(i => i.sana === false).length;
    return { cajas, sueltas, rotas };
  }

  global.DevolucionLogica = { pedidoIdDe, renglonesDevolvibles, pendienteDe, armar, resumen };
  if (typeof module !== "undefined" && module.exports) module.exports = global.DevolucionLogica;

})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
(function () {
  const D = window.DevolucionLogica;
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* ── Quién ──────────────────────────────────────────────────────
     El celular lo comparten dos personas: el nombre se vuelve a pedir
     después de un rato, porque una devolución con el nombre equivocado
     es peor que una sin nombre. */
  const OPERARIOS = ["MARCELO", "JUAN"], K_QUIEN = "qr_dev_quien_v1", VIGENCIA_MIN = 60;
  let quien = null;
  try {
    const q = JSON.parse(localStorage.getItem(K_QUIEN) || "null");
    if (q && q.nombre && Date.now() - q.desde < VIGENCIA_MIN * 60000) quien = q.nombre;
  } catch (e) {}
  function pintarQuien() {
    $("quienes").innerHTML = OPERARIOS.map(n =>
      '<button class="quien' + (quien === n ? " on" : "") + '" data-n="' + n + '">' + n + "</button>").join("");
    $("quienes").querySelectorAll("button").forEach(b => b.onclick = () => {
      quien = b.dataset.n;
      try { localStorage.setItem(K_QUIEN, JSON.stringify({ nombre: quien, desde: Date.now() })); } catch (e) {}
      pintarQuien();
    });
  }
  pintarQuien();

  /* ── Datos que vienen de la PC ─────────────────────────────────── */
  let snapshot = { comprobantes: [], publicado: null }, devoluciones = [];
  async function traer() {
    const [s, d] = await Promise.all([
      fetch("/api/puente/snapshot", { cache: "no-store" }).then(r => r.json()),
      fetch("/api/puente/devoluciones", { cache: "no-store" }).then(r => r.json()),
    ]);
    snapshot = s; devoluciones = d.devoluciones || [];
  }

  function pintarHistorial() {
    const ult = devoluciones.slice().reverse().slice(0, 8);
    if (!ult.length) { $("historial").className = "vacio"; $("historial").textContent = "Todavía no registraste ninguna."; return; }
    $("historial").className = "";
    $("historial").innerHTML = ult.map(d => {
      const r = D.resumen(d);
      return '<div class="hist"><div><b>' + esc(d.cliente_nombre || "Pedido " + d.pedido_id) + "</b><br>" +
        '<span class="sub">' + r.cajas + " caja(s)" + (r.sueltas ? " + " + r.sueltas + " un." : "") +
        (r.rotas ? " · " + r.rotas + " dañada(s)" : "") + " · " + esc(d.quien || "") + "</span></div>" +
        (d.estado === "acreditada"
          ? '<span class="chip a">✓ ' + esc(d.nc || "acreditada") + "</span>"
          : '<span class="chip p">esperando nota de crédito</span>') + "</div>";
    }).join("");
  }

  /* ── Escaneo ─────────────────────────────────────────────────────── */
  let cerrarCam = null, comp = null, cantidades = {};

  function msg(id, tipo, texto) { $(id).innerHTML = texto ? '<div class="msg ' + tipo + '">' + texto + "</div>" : ""; }

  async function abrirPedido(crudo) {
    const id = D.pedidoIdDe(crudo);
    if (!id) return msg("msgEscaneo", "err", "Ese código no es de una etiqueta de pedido (tiene que empezar con <b>ML-</b>).");
    try { await traer(); } catch (e) {
      return msg("msgEscaneo", "err", "No llego a la PC. Revisá que el celular esté en el mismo wifi y que la PC tenga el servidor prendido.");
    }
    pintarHistorial();
    const c = (snapshot.comprobantes || []).find(x => String(x.pedido_id) === String(id));
    if (!c) {
      return msg("msgEscaneo", "err", "No encuentro el pedido <b>" + esc(id) + "</b> con remito emitido." +
        (snapshot.publicado ? "" : " La PC todavía no publicó nada: abrí <b>Facturación</b> en la PC.") );
    }
    const filas = D.renglonesDevolvibles(c, devoluciones);
    if (!filas.some(f => f.disponible > 0)) {
      return msg("msgEscaneo", "aviso", "De este pedido ya no queda nada por devolver (todo está acreditado o esperando nota de crédito).");
    }
    comp = c; cantidades = {};
    msg("msgEscaneo", "", "");
    detenerCamara();
    pintarPedido();
  }

  function pintarPedido() {
    const filas = D.renglonesDevolvibles(comp, devoluciones);
    $("pCliente").textContent = comp.cliente_nombre || ("Pedido " + comp.pedido_id);
    $("pRemito").textContent = "Remito " + comp.numero;
    $("filas").innerHTML = filas.map(f => {
      const c = cantidades[f.i] || { n: 0, sana: true };
      return '<div class="fila' + (f.disponible ? "" : " sin") + '" data-i="' + f.i + '">' +
        '<div class="art">' + esc(f.nombre) + (f.variante ? " · " + esc(f.variante) : "") + "</div>" +
        '<div class="det">salieron ' + f.enviado + (f.unidad === "cajas" ? " caja(s)" : " un.") +
        (f.disponible < f.enviado ? " · se pueden devolver " + f.disponible : "") + "</div>" +
        (f.disponible ? '<div class="ctl"><button class="paso" data-d="-1">−</button><span class="n">' + c.n + '</span>' +
          '<button class="paso" data-d="1">+</button>' +
          '<div class="estado"><button class="est sana' + (c.sana ? " on" : "") + '" data-s="1">Sana</button>' +
          '<button class="est rota' + (!c.sana ? " on" : "") + '" data-s="0">Dañada</button></div></div>' : "") + "</div>";
    }).join("");

    $("filas").querySelectorAll(".fila").forEach(el => {
      const i = +el.dataset.i, f = filas[i];
      el.querySelectorAll(".paso").forEach(b => b.onclick = () => {
        const c = cantidades[i] || (cantidades[i] = { n: 0, sana: true });
        c.n = Math.max(0, Math.min(f.disponible, c.n + (+b.dataset.d)));
        pintarPedido();
      });
      el.querySelectorAll(".est").forEach(b => b.onclick = () => {
        const c = cantidades[i] || (cantidades[i] = { n: 0, sana: true });
        c.sana = b.dataset.s === "1";
        pintarPedido();
      });
    });
    $("secPedido").classList.remove("oculto");
    $("secEscaneo").classList.add("oculto");
  }

  function volverAEscanear() {
    comp = null; cantidades = {};
    $("secPedido").classList.add("oculto");
    $("secEscaneo").classList.remove("oculto");
    msg("msgPedido", "", "");
    $("codigo").value = "";
  }

  $("btnOtra").onclick = volverAEscanear;

  $("btnRegistrar").onclick = async () => {
    const id = "dvc-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const r = D.armar({ id, comp, devoluciones, cantidades, quien });
    if (r.error) return msg("msgPedido", "err", esc(r.error));
    $("btnRegistrar").disabled = true;
    try {
      const resp = await fetch("/api/puente/devoluciones", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(r.registro),
      });
      const j = await resp.json();
      if (!resp.ok) throw new Error(j.error || "no se pudo guardar");
      const res = D.resumen(r.registro);
      volverAEscanear();
      await traer(); pintarHistorial();
      msg("msgEscaneo", "ok", "✓ Devolución registrada: " + res.cajas + " caja(s)" + (res.sueltas ? " + " + res.sueltas + " un." : "") +
        ". Laura la ve en Facturación para hacer la nota de crédito.");
    } catch (e) {
      msg("msgPedido", "err", "No se pudo guardar: " + esc(e.message) + ". Probá de nuevo.");
    }
    $("btnRegistrar").disabled = false;
  };

  $("btnBuscar").onclick = () => { const v = $("codigo").value.trim(); if (v) abrirPedido(v); };
  $("codigo").addEventListener("keydown", e => { if (e.key === "Enter") $("btnBuscar").click(); });

  /* ── Cámara ───────────────────────────────────────────────────────
     BarcodeDetector viene en Chrome de Android. Pide https (o localhost). */
  function detenerCamara() {
    if (cerrarCam) { cerrarCam(); cerrarCam = null; }
    $("video").classList.add("oculto");
    $("btnCam").textContent = "📷 Prender la cámara";
  }

  async function prenderCamara() {
    if (!window.isSecureContext) {
      return msg("msgEscaneo", "err", "La cámara solo anda en una página segura. Entrá por <b>https://…:8766</b> (ver el link que te pasó Claude) o escribí el código a mano.");
    }
    if (!window.BarcodeDetector) {
      return msg("msgEscaneo", "err", "Este navegador no lee códigos de barras con la cámara. Probá con Chrome, o escribí el código a mano.");
    }
    try {
      const detector = new BarcodeDetector({ formats: ["code_128"] });
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 } } });
      const v = $("video");
      v.srcObject = stream; await v.play();
      v.classList.remove("oculto");
      $("btnCam").textContent = "⏹ Apagar la cámara";
      let vivo = true, ultimo = "", ultimoEn = 0;
      cerrarCam = () => { vivo = false; try { stream.getTracks().forEach(t => t.stop()); } catch (e) {} v.srcObject = null; };
      const loop = async () => {
        if (!vivo) return;
        try {
          const cs = await detector.detect(v);
          if (cs && cs.length) {
            const c = String(cs[0].rawValue || ""), t = Date.now();
            if (c && (c !== ultimo || t - ultimoEn > 3000)) { ultimo = c; ultimoEn = t; if (navigator.vibrate) navigator.vibrate(60); abrirPedido(c); }
          }
        } catch (e) {}
        if (vivo) requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
      msg("msgEscaneo", "", "");
    } catch (e) {
      msg("msgEscaneo", "err", "No pude prender la cámara (" + esc(e.name || e.message) + "). Dale permiso de cámara al navegador o escribí el código.");
    }
  }

  $("btnCam").onclick = () => { if (cerrarCam) detenerCamara(); else prenderCamara(); };

  traer().then(pintarHistorial).catch(() => { $("historial").textContent = "No llego a la PC todavía."; });
  /* El remito se busca al escanear, y ahí se baja todo. El historial se mantiene con el aviso
     de cambios, solo con la pantalla a la vista: no vuelve a bajar los remitos cada pocos segundos. */
  const refrescarHistorial = () => {
    if (comp || document.hidden) return;
    fetch("/api/puente/devoluciones", { cache: "no-store" }).then(r => r.json())
      .then(d => { devoluciones = d.devoluciones || []; pintarHistorial(); }).catch(() => {});
  };
  if (window.QRSrv && QRSrv.escuchar) QRSrv.escuchar(["qr_devoluciones"], refrescarHistorial);
  else setInterval(refrescarHistorial, 6000);
  document.addEventListener("visibilitychange", refrescarHistorial);
})();
</script>
</body>
